output_dir: docs/results/rtx4060_laptop
warmup: 5
runs: 20
backends: [cpu, torch_cpu, torch_cuda, onnxruntime_cpu, onnxruntime_cuda]
benchmarks:
  - name: rtx4060_matmul_256
    operator: matmul
    matrix_m: 256
    matrix_k: 256
    matrix_n: 256
    precision_modes: [fp32]
  - name: rtx4060_conv3x3_64ch
    operator: conv2d
    input_shape: [1, 32, 64, 64]
    output_channels: 64
    kernel_size: [3, 3]
    stride: 1
    padding: 1
    precision_modes: [fp32]
