[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyedgebench"
version = "0.1.0"
description = "A local benchmark tool for low-bit edge-AI operators."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "TinyEdgeBench contributors"}
]
keywords = ["edge-ai", "benchmark", "int8", "operators", "numpy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "streamlit>=1.35"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4"
]
torch = [
  "torch>=2.2"
]
onnx = [
  "onnx>=1.16",
  "onnxruntime>=1.17"
]
onnx-gpu = [
  "onnx>=1.16",
  "onnxruntime-gpu>=1.17"
]
real-backends = [
  "torch>=2.2",
  "onnx>=1.16",
  "onnxruntime>=1.17"
]
real-backends-gpu = [
  "torch>=2.2",
  "onnx>=1.16",
  "onnxruntime-gpu>=1.17"
]

[project.scripts]
tinyedgebench = "tinyedgebench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
